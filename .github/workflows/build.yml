name: Windows build

on:
  push:
    branches: [main, feature/modern-wpf-dashboard]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OpenFleetIT.slnx
      - name: Build
        run: dotnet build OpenFleetIT.slnx -c Release --no-restore --warnaserror
      - name: Run alpha tests
        run: dotnet run --project OpenFleetIT.Tests -c Release --no-build
      - name: Publish self-contained alpha
        run: dotnet publish OpenFleetIT.App/OpenFleetIT.App.csproj -p:PublishProfile=win-x64
      - name: Publish read-only Helper alpha
        run: dotnet publish OpenFleetIT.Helper/OpenFleetIT.Helper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/OpenFleetIT-Helper-v0.2.0-alpha.1-win-x64
      - name: Add release manifest
        shell: pwsh
        run: |
          $releasePath = "artifacts/OpenFleetIT-v0.1.1-alpha.1-win-x64"
          $hash = (Get-FileHash "$releasePath/OpenFleetIT.App.exe" -Algorithm SHA256).Hash
          "$hash  OpenFleetIT.App.exe" | Set-Content "$releasePath/checksums.txt" -Encoding ascii
          Copy-Item V0.1.1-RELEASE-NOTES.md,LICENSE.md,SECURITY.md "$releasePath/"
          Copy-Item release/sbom.spdx.json "$releasePath/"
          $helperPath = "artifacts/OpenFleetIT-Helper-v0.2.0-alpha.1-win-x64"
          $helperHash = (Get-FileHash "$helperPath/OpenFleetIT.Helper.exe" -Algorithm SHA256).Hash
          "$helperHash  OpenFleetIT.Helper.exe" | Set-Content "$helperPath/checksums.txt" -Encoding ascii
          Copy-Item docs/HOME-HELPER-ALPHA.md,LICENSE.md,SECURITY.md "$helperPath/"
          Copy-Item installer/Install-OpenFleetHelper.ps1,installer/Uninstall-OpenFleetHelper.ps1 "$helperPath/"
      - uses: actions/upload-artifact@v7
        with:
          name: OpenFleetIT-v0.1.1-alpha.1-win-x64
          path: artifacts/OpenFleetIT-v0.1.1-alpha.1-win-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: OpenFleetIT-Helper-v0.2.0-alpha.1-win-x64
          path: artifacts/OpenFleetIT-Helper-v0.2.0-alpha.1-win-x64/
          if-no-files-found: error
